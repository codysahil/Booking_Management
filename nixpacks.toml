[phases.setup]
nixPkgs = ['php82', 'composer', 'nodejs_20', 'npm-9']

[phases.install]
cmds = [
    'composer install --no-dev --optimize-autoloader',
    'npm install'
]

[phases.build]
cmds = [
    'npm run build',
    'php artisan storage:link || true'
]

[phases.deploy]
cmds = [
    'php artisan migrate --force'
]

[start]
cmd = 'php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'
