[phases.setup]
nixPkgs = ['php82', 'php82Packages.composer', 'nodejs_20']

[phases.install]
cmds = [
    'composer install --no-dev --optimize-autoloader',
    'npm install'
]

[phases.build]
cmds = [
    'npm run build',
    'echo "Build completed, checking files..."',
    'ls -la public/build/ || echo "Build directory not found"',
    'test -f public/build/.vite/manifest.json && echo "Manifest exists" || echo "Manifest missing"'
]

[start]
cmd = 'php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'
